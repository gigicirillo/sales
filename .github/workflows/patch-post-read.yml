name: Patch POST read compatibility
on:
  push:
    paths:
      - '.github/workflows/patch-post-read.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Code.gs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('google-apps-script/Code.gs')
          s=p.read_text()
          old="function doPost(e){try{const data=JSON.parse(e.postData.contents||'{}');if(data.action==='login')return login_(data);if(data.action==='authCheck')return authCheck_(data);if(data.action==='logout')return logout_(data);"
          new="function doPost(e){try{const data=JSON.parse(e.postData.contents||'{}');if(data.action==='login')return login_(data);if(data.action==='authCheck')return authCheck_(data);if(data.action==='logout')return logout_(data);if(data.action==='report'||data.action==='logs')return doGet({parameter:data});"
          if old not in s:
              raise SystemExit('Expected doPost signature not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/patch-post-read.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add google-apps-script/Code.gs .github/workflows/patch-post-read.yml
          git commit -m "Support report and log reads via POST"
          git push