name: Optimize report sheet reads
on:
  push:
    paths:
      - '.github/workflows/optimize-report-read.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limit report reads to requested months
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('google-apps-script/Code.gs')
          s=p.read_text()
          old="const ss=SpreadsheetApp.openById(SPREADSHEET_ID),rows=[];ss.getSheets().forEach(sheet=>{if(!/^\\d{4}-\\d{2}$/.test(sheet.getName())||sheet.getLastRow()<2)return;"
          new="const ss=SpreadsheetApp.openById(SPREADSHEET_ID),rows=[],fromMonth=from.slice(0,7),toMonth=to.slice(0,7),monthNames=[];let cursor=new Date(Number(fromMonth.slice(0,4)),Number(fromMonth.slice(5,7))-1,1),endMonth=new Date(Number(toMonth.slice(0,4)),Number(toMonth.slice(5,7))-1,1);while(cursor<=endMonth){monthNames.push(Utilities.formatDate(cursor,Session.getScriptTimeZone(),'yyyy-MM'));cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1)}monthNames.forEach(monthName=>{const sheet=ss.getSheetByName(monthName);if(!sheet||sheet.getLastRow()<2)return;"
          if old not in s:
              raise SystemExit('Target report scan pattern not found; no changes made')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/Code.gs
          git commit -m "Limit report reads to requested months"
          git push
