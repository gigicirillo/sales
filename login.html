<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Accesso</title><link rel="stylesheet" href="login.css?v=20260915-eye1"></head><body><main class="login-shell"><section class="login-card"><h1>Accesso</h1><p>Inserisci le credenziali del tuo account operatore.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<span class="password-field"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="togglePassword" class="password-toggle" aria-label="Mostra password" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3 3.7M6.6 6.6C3.6 8.5 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label><button id="loginButton">Accedi</button><p id="loginMessage"></p></form></section></main><script src="config.js?v=20260831-final1"></script><script src="auth.js?v=20260915-post1"></script><script>SalesAuth.redirectIfLoggedIn();const password=document.getElementById('password'),togglePassword=document.getElementById('togglePassword');togglePassword.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';togglePassword.classList.toggle('is-visible',show);togglePassword.setAttribute('aria-pressed',String(show));togglePassword.setAttribute('aria-label',show?'Nascondi password':'Mostra password')});document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('loginButton'),m=document.getElementById('loginMessage');b.disabled=true;b.textContent='Accesso…';m.textContent='';try{const user=await SalesAuth.login(document.getElementById('username').value.trim(),password.value);location.href=user?.role==='admin'?'report.html':'index.html'}catch(err){m.textContent=err.message||'Accesso non riuscito'}finally{b.disabled=false;b.textContent='Accedi'}});</script></body></html>
