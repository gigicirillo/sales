<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Accesso</title><link rel="stylesheet" href="login.css?v=1"></head><body><main class="login-shell"><section class="login-card"><div class="mark">SALES</div><h1>Accesso</h1><p>Inserisci le credenziali del tuo account operatore.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton">Accedi</button><p id="loginMessage"></p></form></section></main><script src="config.js?v=20260831-final1"></script><script src="auth.js?v=1"></script><script>SalesAuth.redirectIfLoggedIn();document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('loginButton'),m=document.getElementById('loginMessage');b.disabled=true;b.textContent='Accesso…';m.textContent='';try{await SalesAuth.login(document.getElementById('username').value.trim(),document.getElementById('password').value);location.href='index.html'}catch(err){m.textContent=err.message||'Accesso non riuscito'}finally{b.disabled=false;b.textContent='Accedi'}});</script></body></html>
