<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Futura Clubs | Indice</title>
  <link rel="stylesheet" href="report.css?v=20260827-2325" />
</head>
<body>
  <main class="report-shell">
    <header class="report-topbar">
      <div><p class="eyebrow">Futura Clubs</p><p>Indice comparativo delle attività commerciali in rapporto alle ore lavorate.</p></div>
      <nav class="top-nav" aria-label="Navigazione principale">
        <a class="top-nav-link" href="report.html">Dashboard</a>
        <a class="top-nav-link active" href="performance.html">Indice</a>
        <a class="top-nav-link" href="index.html">Inserimento Daily</a>
      </nav>
    </header>

    <section class="filters-card">
      <div class="filter-field"><label for="dateFrom">Dal</label><input id="dateFrom" type="date" /></div>
      <div class="filter-field"><label for="dateTo">Al</label><input id="dateTo" type="date" /></div>
      <div class="filter-field"><label for="centerFilter">Centro</label><select id="centerFilter"><option value="all">Tutti i centri</option><option>Futura Evo</option><option>Futura Fit</option></select></div>
      <div class="filter-field"><label for="performanceSeller">Venditore</label><select id="performanceSeller"><option value="all">Tutti i venditori</option><option>Donatella</option><option>Elena</option><option>Erika</option><option>Francesco</option><option>Ramses</option></select></div>
      <button id="applyFilters" type="button">Aggiorna indice</button>
    </section>

    <section class="performance-box">
      <div class="performance-head"><div><h2>Indice di performance</h2><p>Le attività selezionate vengono rapportate alle ore lavorate e normalizzate sul miglior risultato del gruppo.</p></div></div>
      <div class="performance-options"><strong>Azioni incluse:</strong><label><input type="checkbox" class="performance-toggle" value="messagesSent" checked /> Messaggi</label><label><input type="checkbox" class="performance-toggle" value="callsMade" checked /> Telefonate</label><label><input type="checkbox" class="performance-toggle" value="soldSubscriptionsTotal" checked /> Abbonamenti</label><label><input type="checkbox" class="performance-toggle" value="quotes" checked /> Preventivi</label><label><input type="checkbox" class="performance-toggle" value="passesVouchersDelivered" checked /> Pass/Voucher consegnati</label><label><input type="checkbox" class="performance-toggle" value="passesVouchersActivated" checked /> Pass/Voucher attivati</label></div>
      <div class="performance-chart-wrap"><canvas id="performanceIndexChart" width="1200" height="380"></canvas></div>
      <div id="performanceBreakdown" class="performance-breakdown"></div>
    </section>
    <div class="report-actions"><p id="reportMessage" aria-live="polite"></p></div>
  </main>
  <script src="config.js?v=20260827-2325"></script>
  <script src="performance.js?v=20260827-2325"></script>
</body>
</html>
